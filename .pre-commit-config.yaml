repos:
  # Zsh syntax check — only reliable tool for zsh files
  - repo: local
    hooks:
      - id: zsh-syntax-check
        name: zsh syntax check
        language: system
        entry: zsh -n
        files: (\.zsh|^[^/]+\.sh)$ # .zsh files + root scripts (bootstrap.sh etc. are zsh); nested .sh may be bash

      # herdr disables an unparseable keybinding with only a warning; this fails instead
      - id: herdr-config-check
        name: herdr config check
        language: system
        entry: env XDG_CONFIG_HOME=herdr/.config herdr config check
        files: ^herdr/\.config/herdr/config\.toml$
        pass_filenames: false

  # Lua formatting — check mode (formats on save in Neovim; CI only checks)
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.0.2
    hooks:
      - id: stylua

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-toml
